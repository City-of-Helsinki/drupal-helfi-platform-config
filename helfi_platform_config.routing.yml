helfi_platform_config.content_cards_htmx:
  path: '/content-cards/{paragraph}/htmx'
  defaults:
    _controller: '\Drupal\helfi_platform_config\Controller\ContentCardsHtmxController::content'
  requirements:
    _entity_access: 'paragraph.view'
  options:
    _htmx_route: 'TRUE'
    parameters:
      paragraph:
        type: 'entity:paragraph'
