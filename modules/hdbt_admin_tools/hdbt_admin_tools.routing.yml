hdbt_admin_tools.list_all:
  path: '/admin/tools'
  defaults:
    _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
    _title: 'Tools'
  requirements:
    _permission: 'access administration pages'
  options:
    _admin_route: TRUE

hdbt_admin_tools.site_settings:
  path: '/admin/tools/site-settings'
  defaults:
    _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
    _title: 'Site settings'
  requirements:
    _permission: 'administer site configuration+access administration pages'
  options:
    _admin_route: TRUE

hdbt_admin_tools.appearance_settings:
  path: '/admin/tools/appearance-settings'
  defaults:
    _form: '\Drupal\hdbt_admin_tools\Form\SiteSettings'
    _title: 'Site settings'
  requirements:
    _permission: 'access administration pages'
  options:
    _admin_route: TRUE

hdbt_admin_tools.taxonomy:
  path: '/admin/structure/taxonomy'
  requirements:
    _permission: 'access taxonomy overview'

hdbt_admin_tools.user_login_link:
  path: '/user/{user}/login-link'
  defaults:
    _form: 'Drupal\hdbt_admin_tools\Form\UserLoginLink'
    _title: 'Reset password'
  requirements:
    _permission: 'administer users'
    _csrf_token: 'TRUE'
  options:
    _admin_route: TRUE
