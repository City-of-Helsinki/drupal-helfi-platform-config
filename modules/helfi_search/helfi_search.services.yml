parameters:
  # Content that is allowed to produce vector embeddings.
  helfi_search.vectorized_entity_types:
    - { entity_type: 'node', bundles: ['page', 'landing_page'] }
    - { entity_type: 'tpr_service' }
    - { entity_type: 'tpr_unit' }

services:
  _defaults:
    autowire: true
    autoconfigure: true

  logger.channel.helfi_search:
    parent: logger.channel_base
    arguments: ['helfi_search']

  Drupal\helfi_search\TokenUsageTracker: ~

  Drupal\helfi_search\EmbeddingApiInterface:
    class: Drupal\helfi_search\OpenAI\EmbeddingsApi

  Drupal\helfi_search\Queue\QueueManager: ~

  Drupal\helfi_search\Pipeline\HtmlExtractor: ~
  Drupal\helfi_search\Pipeline\HtmlCleaner: ~
  Drupal\helfi_search\Pipeline\ContentChunker: ~
  Drupal\helfi_search\Pipeline\ChunkAnnotator: ~
  Drupal\helfi_search\Pipeline\TextPipeline: ~

  Drupal\helfi_search\QueryBuilder: ~

  Drupal\helfi_search\EventSubscriber\SearchApiSubscriber: ~
