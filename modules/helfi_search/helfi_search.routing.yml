helfi_search.overview:
  path: '/admin/tools/helfi-search'
  defaults:
    _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
    _title: 'Hel.fi site search'
  requirements:
    _permission: 'administer helfi_search'
  options:
    _admin_route: TRUE

helfi_search.semantic_search:
  path: '/api/v1/search'
  defaults:
    _controller: '\Drupal\helfi_search\Controller\SearchController::search'
  requirements:
    _permission: 'access content'
  methods: [GET]

helfi_search.settings_form:
  path: '/admin/tools/helfi-search/helfi-search-settings'
  defaults:
    _form: '\Drupal\helfi_search\Form\SearchSettingsForm'
    _title: 'Hel.fi site search settings'
  requirements:
    _permission: 'administer helfi_search'
    _custom_access: 'Drupal\helfi_search\Form\SearchSettingsForm::access'
  options:
    _admin_route: TRUE

helfi_search.similar_content:
  path: '/api/v1/similar-content/{entity_type}/{entity}/{langcode}'
  defaults:
    _controller: '\Drupal\helfi_search\SimilarContent\SimilarContentController::view'
    _title_callback: '\Drupal\helfi_search\SimilarContent\SimilarContentController::title'
  requirements:
    _entity_access: 'entity.update'
    entity_type: '[a-z_]+'
  options:
    parameters:
      entity:
        type: 'entity:{entity_type}'
