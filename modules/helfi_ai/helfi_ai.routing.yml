helfi_ai.overview:
  path: '/admin/tools/ai'
  defaults:
    _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
    _title: 'AI'
  requirements:
    _permission: 'manage ai prompts'
  options:
    _admin_route: TRUE

helfi_ai.tone_check:
  path: '/helfi-ai/tone-check'
  defaults:
    _controller: 'Drupal\helfi_ai\Controller\ToneCheckController::check'
  methods: [POST]
  requirements:
    _permission: 'use helfi ai tone check'
    _csrf_request_header_token: 'TRUE'

helfi_ai.summary_stream:
  path: '/helfi-ai/summary'
  defaults:
    _controller: 'Drupal\helfi_ai\Controller\SummaryController::summary'
  methods: [POST]
  requirements:
    _permission: 'use helfi ai summary'
    _csrf_request_header_token: 'TRUE'
