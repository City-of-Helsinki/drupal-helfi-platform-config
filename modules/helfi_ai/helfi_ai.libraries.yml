ai_summary_confirm:
  version: HELFI_DEPLOYMENT_IDENTIFIER
  js:
    js/ai-summary-confirm.js: {}
  dependencies:
    - core/drupal
    - core/once

# Reads server-sent events streamed by the Helfi AI routes.
stream:
  version: HELFI_DEPLOYMENT_IDENTIFIER
  js:
    js/ai-stream.js: {}
  dependencies:
    - core/drupal

# Streams a generated AI summary into the summary editor.
ai_summary_stream:
  version: HELFI_DEPLOYMENT_IDENTIFIER
  js:
    js/ai-summary-stream.js: {}
  dependencies:
    - core/drupal
    - core/drupal.ajax
    - helfi_ai/ai_summary_confirm
    - helfi_ai/stream

# Applies a chosen AI SEO-title suggestion to the node title field.
title_suggest:
  version: HELFI_DEPLOYMENT_IDENTIFIER
  js:
    js/ai-title-suggest.js: {}
  dependencies:
    - core/drupal
    - core/once
    - core/jquery
    - core/drupal.dialog

# Tone-check CKEditor 5 plugin.
tone_check:
  version: HELFI_DEPLOYMENT_IDENTIFIER
  js:
    assets/js/build/aiToneCheck.js: { preprocess: false, minified: true }
  dependencies:
    - core/ckeditor5
    - helfi_ai/stream
