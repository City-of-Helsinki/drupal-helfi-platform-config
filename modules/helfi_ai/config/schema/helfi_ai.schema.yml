helfi_ai.settings:
  type: config_object
  label: 'HELfi AI settings'
  mapping:
    enable_seo_title:
      type: boolean
      label: 'Enable AI SEO title'
    enable_tone_check:
      type: boolean
      label: 'Enable AI tone check'
    seo_title_bundles:
      type: sequence
      label: 'Content types offering AI SEO title suggestions'
      sequence:
        type: string
        label: 'Content type machine name'
    text_services:
      type: mapping
      label: 'Helfi Text Services API'
      mapping:
        api_key:
          type: string
          label: 'API key, set in settings.php and never exported'
