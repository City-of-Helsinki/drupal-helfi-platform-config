services:
  _defaults:
    autowire: true
    autoconfigure: true

  logger.channel.helfi_ai:
    parent: logger.channel_base
    arguments: ['helfi_ai']

  Drupal\helfi_ai\Service\AiGenerator: ~

  Drupal\helfi_ai\Config\ToneCheckToolbarOverride:
    arguments:
      - '@config.storage'
    tags:
      - { name: config.factory.override }
