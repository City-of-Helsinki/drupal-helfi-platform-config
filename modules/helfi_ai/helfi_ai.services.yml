services:
  _defaults:
    autowire: true
    autoconfigure: true

  logger.channel.helfi_ai:
    parent: logger.channel_base
    arguments: ['helfi_ai']

  Drupal\helfi_ai\TextServices\TextServicesClientInterface:
    class: Drupal\helfi_ai\TextServices\TextServicesClient

  Drupal\helfi_ai\Service\TextServicesGenerator: ~

  Drupal\helfi_ai\ToneCheck\ToneCheckPrecheck:
    arguments:
      $taskStorage: '@?Drupal\helfi_entity_task\EntityTaskStorage'

  Drupal\helfi_ai\Config\ToneCheckToolbarOverride:
    arguments:
      - '@config.storage'
    tags:
      - { name: config.factory.override }

  Drupal\helfi_ai\ToneCheck\ToneCheckNotificationProvider:
    tags:
      - { name: helfi_platform_config.entity_notification_provider }
