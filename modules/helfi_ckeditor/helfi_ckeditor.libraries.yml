# Helfi Link CKEditor5 plugin JavaScript and CSS.
helfi_link:
  version: HELFI_DEPLOYMENT_IDENTIFIER
  js:
    assets/js/build/helfiLink.js: { preprocess: false, minified: true }
  css:
    theme:
      assets/css/helfi_link_plugin.css: { }
      assets/css/helfi_ckeditor_tom_select.css: { }
  dependencies:
    - core/ckeditor5

